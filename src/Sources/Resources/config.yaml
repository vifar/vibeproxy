# Server port (CLIProxyAPI runs on 8318, ThinkingProxy forwards from 8317)
port: 8318

# Bind to localhost only for security (prevents exposure on public IPs)
host: 127.0.0.1

# Amp CLI integration (management requests only - login, user, threads)
amp-upstream-url: "https://ampcode.com"
amp-restrict-management-to-localhost: true

# Management API settings
remote-management:
  allow-remote: false
  secret-key: ""  # Leave empty to disable management API

# Authentication directory (stores OAuth tokens)
auth-dir: "~/.cli-proxy-api"

# Logging configuration
debug: false
logging-to-file: false

# Usage statistics
usage-statistics-enabled: true

# Network proxy (if needed for corporate networks)
proxy-url: ""

# Retry configuration
request-retry: 3

# Timeout for upstream provider requests
# Default: 10m. Set to "0" to disable timeout.
# Important for Extended Thinking requests which may take 5-10+ minutes.
request-timeout: "10m"

# Routing: session-sticky round robin is the default. Mixed-provider routes
# balance providers equally before rotating credentials inside a provider.
routing:
  strategy: round-robin
  session-affinity: true
  session-affinity-ttl: "1h"

# Quota management
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# OAuth providers for local subscriptions
# Claude, Codex (GPT), Gemini tokens in ~/.cli-proxy-api/ will be used
# No fallback - users must authenticate providers they want to use

# No API keys needed for OAuth-based providers
generative-language-api-key: []

# Pulled providers. Model lists are fetched automatically from upstream
# catalogs at runtime (models.opencode.ai/api.json + provider endpoints) and
# merged into ~/.cli-proxy-api/merged-config.yaml. Nothing here is a static
# model list; the only static input is the user's own provider/model selection.
openai-compatibility:
  - name: ollama-cloud
    display-name: Ollama Cloud
    help-text: "Ollama Cloud API - DeepSeek, Kimi, GLM, MiniMax models"
    base-url: https://ollama.com/v1

  - name: opencode-go
    display-name: OpenCode Go
    help-text: "OpenCode Go API - DeepSeek, Kimi, GLM, GPT, Grok, Qwen models"
    base-url: https://opencode.ai/zen/go/v1
