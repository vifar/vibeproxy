name: Management Console

on:
  push:
    paths:
      - 'management-console/**'
      - '.github/workflows/management-console.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'management-console/**'
      - '.github/workflows/management-console.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify console
        run: bun run verify
      - name: Check local helper scripts
        run: |
          node --check scripts/vibeproxy-model-bridge.mjs
          node --check scripts/vibeproxy-models.mjs
          node --check scripts/install-local.mjs
      - name: Upload management page
        uses: actions/upload-artifact@v4
        with:
          name: vibeproxy-management-console
          path: management-console/dist/index.html
